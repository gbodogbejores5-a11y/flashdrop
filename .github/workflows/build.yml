name: Build jrsdrop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependances
        run: pip install pyinstaller pillow tkinterdnd2
      - name: Icone
        run: python make_icon.py
      - name: Compiler jrsdrop.exe
        run: pyinstaller --onefile --noconsole --name jrsdrop --icon assets/icon.ico --add-data "assets;assets" --collect-all tkinterdnd2 jrsdrop.py
      - name: Installeur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "import fdcore; print(fdcore.VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: jrsdrop
          path: |
            dist/jrsdrop.exe
            dist/jrsdrop-setup.exe
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jrsdrop-setup.exe
            dist/jrsdrop.exe